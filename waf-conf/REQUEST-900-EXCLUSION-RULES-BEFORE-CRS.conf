SecRuleEngine On
SecAuditEngine On
SecAuditLog /var/log/modsecurity/audit.log
SecAuditLogType Serial

SecRuleUpdateActionById 949110 "t:none,deny,status:406,logdata:%{SERVER_NAME}"
SecRuleUpdateActionById 959100 "t:none,deny,status:406,logdata:%{SERVER_NAME}"

SecAction \
  "id:900000,\
  phase:1,\
  nolog,\
  pass,\
  t:none,\
  setvar:tx.paranoia_level=2"

SecRule REQUEST_FILENAME "@rx ^/case/[^/]+/contacts/[^/]+$" \
  "id:1001001,\
  phase:1,\
  pass,\
  nolog,\
  ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:details,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:details,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:details,\
  ctl:ruleRemoveTargetByTag=attack-xss;ARGS:details"

SecRule REQUEST_FILENAME "@rx ^/case/[A-Z][0-9]{6}/[0-9]+/update-contact$" \
  "id:1001002,\
  phase:1,\
  pass,\
  nolog,\
  ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:details,\
  ctl:ruleRemoveTargetByTag=attack-rce;ARGS:details,\
  ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:details,\
  ctl:ruleRemoveTargetByTag=attack-xss;ARGS:details"

SecRule REQUEST_FILENAME "@rx ^/case/[^/]+/(contacts/[^/]+|[^/]+/update-contact)$" \
  "id:100103,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetById=922130;MULTIPART_PART_HEADERS:fileUpload,\
    ctl:ruleRemoveTargetById=920120;FILES:fileUpload,\
    ctl:ruleRemoveTargetById=920120;FILES_NAMES:fileUpload,\
    ctl:ruleRemoveTargetById=920121;FILES:fileUpload,\
    ctl:ruleRemoveTargetById=920121;FILES_NAMES:fileUpload"
