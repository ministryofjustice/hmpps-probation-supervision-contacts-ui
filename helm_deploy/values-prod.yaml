---
# Per environment values which override defaults in hmpps-probation-supervision-contacts-ui/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: probation-supervision-contacts-ui.hmpps.service.justice.gov.uk
    modsecurity_snippet: |
      SecRuleEngine On
      SecAuditEngine On
      SecAuditLog /var/log/nginx/error.log
      SecAuditLogType Serial
      SecDefaultAction "phase:2,pass,log,tag:github_team=hmpps-manage-people-on-probation,tag:namespace=hmpps-manage-people-on-probation-prod"
      SecRuleUpdateActionById 949110 "t:none,deny,status:406,logdata:%{SERVER_NAME}"
      SecRuleUpdateActionById 959100 "t:none,deny,status:406,logdata:%{SERVER_NAME}"
      SecAction \
        "id:900000,\
         phase:1,\
         nolog,\
         pass,\
         t:none,\
         setvar:tx.paranoia_level=2"

      SecRule REQUEST_URI "@rx ^/case/[^/]+/contacts/[^/]+$" \
        "id:1001001,\
         phase:1,\
         pass,\
         nolog,\
         ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:details,\
         ctl:ruleRemoveTargetByTag=attack-rce;ARGS:details,\
         ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:details,\
         ctl:ruleRemoveTargetByTag=attack-xss;ARGS:details"

      SecRule REQUEST_URI "@rx ^/case/[A-Z][0-9]{6}/[0-9]+/update-contact$" \
        "id:1001002,\
          phase:1,\
          pass,\
          nolog,\
          ctl:ruleRemoveTargetByTag=attack-lfi;ARGS:details,\
          ctl:ruleRemoveTargetByTag=attack-rce;ARGS:details,\
          ctl:ruleRemoveTargetByTag=attack-sqli;ARGS:details,\
          ctl:ruleRemoveTargetByTag=attack-xss;ARGS:details"

  env:
    INGRESS_URL: "https://probation-supervision-contacts-ui.hmpps.service.justice.gov.uk"
    HMPPS_AUTH_URL: "https://sign-in.hmpps.service.justice.gov.uk/auth"
    TOKEN_VERIFICATION_API_URL: "https://token-verification-api.prison.service.justice.gov.uk"
    EXAMPLE_API_URL: 'https://template-kotlin.hmpps.service.justice.gov.uk'
    AUDIT_ENABLED: "true"
    PROBATION_FRONTEND_COMPONENTS_API_URL: 'https://probation-frontend-components.hmpps.service.justice.gov.uk'
    PROBATION_FRONTEND_COMPONENTS_CONNECT_SRC: 'https://probation-frontend-components.hmpps.service.justice.gov.uk'
    PROBATION_FRONTEND_COMPONENTS_FONT_SRC: 'https://probation-frontend-components.hmpps.service.justice.gov.uk'
    MAS_API_URL: 'https://manage-supervision-and-delius.hmpps.service.justice.gov.uk'
    ARNS_API_URL: 'https://assess-risks-and-needs.hmpps.service.justice.gov.uk'
    TIER_API_URL: 'https://hmpps-tier.hmpps.service.justice.gov.uk'
    TIER_LINK: 'https://tier.hmpps.service.justice.gov.uk/case'
    MANAGE_PEOPLE_ON_PROBATION_URL: 'https://manage-people-on-probation.hmpps.service.justice.gov.uk'
    DELIUS_LINK: 'https://ndelius.probation.service.justice.gov.uk'
    FLIPT_URL: 'https://feature-flags-manage-people-on-probation.hmpps.service.justice.gov.uk'

generic-prometheus-alerts:
  alertSeverity: manage-people-on-probation-alerts
